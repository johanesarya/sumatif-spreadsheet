                  <input type="text" id="nama" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="kelas" class="form-label">Kelas</label>
                  <select id="kelas" class="form-select" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X AKL 1">X AKL 1</option>
                    <option value="X AKL 2">X AKL 2</option>
                    <option value="X AKL 3">X AKL 3</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Cek Nilai
                </button>
              </form>

              <div id="hasil" class="mt-4 d-none">
                <h5 class="text-center">
                  Hai, <span id="namaSiswa"></span> dari kelas
                  <span id="kelasSiswa"></span>
                </h5>
                <p class="text-center fs-4 fw-bold">
                  Nilai: <span id="nilai"></span>
                </p>
                <div class="alert text-center" id="pesan"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      // ===============================
      // Logika
      // ===============================
      document
        .getElementById("nilaiForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const nama = document
            .getElementById("nama")
            .value.trim()
            .toLowerCase();
          const kelas = document
            .getElementById("kelas")
            .value.trim()
            .toLowerCase();

          const siswa = dataSiswa.find(
            (s) =>
              s.nama.toLowerCase() === nama && s.kelas.toLowerCase() === kelas
          );

          if (siswa) {
            tampilkanHasil(siswa.nama, siswa.kelas, siswa.nilai);
          } else {
            alert("Data tidak ditemukan. Pastikan nomor peserta & kelas sesuai.");
          }
        });

      function tampilkanHasil(nama, kelas, nilai) {
        document.getElementById("hasil").classList.remove("d-none");
        document.getElementById("namaSiswa").innerText = nama;
        document.getElementById("kelasSiswa").innerText = kelas;
        document.getElementById("nilai").innerText = nilai;

        const pesanEl = document.getElementById("pesan");
        if (nilai <= 30) {
          pesanEl.className = "alert alert-danger";
          pesanEl.innerText = "Jangan putus asa, tetap semangat! 🌱";
        } else if (nilai <= 50) {
          pesanEl.className = "alert alert-warning";
          pesanEl.innerText =
            "Belajar lebih tekun ya, masih bisa diperbaiki 📚";
        } else if (nilai <= 70) {
          pesanEl.className = "alert alert-info";
          pesanEl.innerText = "Sedikit lagi menuju KKM, ayo gas terus 💪";
        } else {
          pesanEl.className = "alert alert-success";
          pesanEl.innerText = "Keren gokil! Pertahankan prestasimu 🎉";
        }
